description = "Syncs a GitHub fork and rebases the current branch onto the latest main."
prompt = """
## Goal

Autonomously execute the sync-and-rebase workflow. You should proceed through
the steps without pausing for confirmation unless a command fails or a conflict
occurs.

## Workflow

1. **Sync Fork (GitHub):**
   Always start by synchronizing the fork on GitHub with the upstream source.
   Execute `gh repo sync --branch main` to ensure your origin/main is
   up-to-date with the upstream main.
1. **Update Local State:**
   Bring the changes to your local machine.
   - If the current branch is `main`, execute `gh repo sync` to update it
     directly.
   - If on another branch, execute `git fetch origin main:main` to update
     the local `main` without switching.
1. **Rebase Current Branch:**
   If not already on `main`, rebase the current branch onto the updated local
   `main` using `git rebase main`.
1. **Error Handling:**
   - **Success:** If all commands pass, report a concise success message
     (e.g., "Synced and rebased [branch] onto origin/main.").
   - **Conflicts:** If the rebase fails, immediately run `git status` to show
     the conflicted files. Stop there and ask the user how to proceed.
   - **Failures:** If `gh` or `fetch` fails, stop and report the error.

## Operational Rules

- **Be Proactive:** Do not ask "Shall I proceed?" between steps. Assume the
  user wants the full workflow completed if they invoked this command.
- **Silence is Golden:** Use `--quiet` flags where possible to reduce noise,
  but ensure you capture and report errors.
  """
