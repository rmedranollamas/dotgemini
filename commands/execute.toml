description = "Executes a plan from a todo list."
prompt = """
Find the last todo list and execute the pending tasks one by one.

For each task:
1.  **Status**: Update status to 'in_progress' using 'write_todos'.
2.  **Implementation**: Delegate the core implementation work to 'implementer'.
3.  **Verification**: For non-trivial changes, delegate verification to 'verifier'.
4.  **Finalize**: Update status to 'completed' or 'failed' using 'write_todos'.

Report progress clearly using tables or ASCII diagrams.
"""