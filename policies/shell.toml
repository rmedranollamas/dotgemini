[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 100
allow_redirection = true
commandPrefix = [
  "awk",
  "base64",
  "cat",
  "chmod",
  "column",
  "cp",
  "curl",
  "date",
  "df",
  "diff",
  "docker",
  "du",
  "echo",
  "env",
  "file",
  "find",
  "free",
  "gemini",
  "gh",
  "git",
  "grep",
  "head",
  "hostname",
  "id",
  "jq",
  "ls",
  "lscpu",
  "mdformat",
  "mkdir",
  "mv",
  "npm",
  "npx",
  "php",
  "ps",
  "pwd",
  "python",
  "python3",
  "ruff",
  "sed",
  "sort",
  "sqlite3",
  "stat",
  "tail",
  "tar",
  "touch",
  "tr",
  "tree",
  "ty",
  "uniq",
  "unzip",
  "uptime",
  "uv",
  "uvx",
  "wc",
  "which",
  "whoami",
  "xargs"
]
