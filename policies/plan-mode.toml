[[rule]]
toolName = "enter_plan_mode"
decision = "allow"
priority = 100

# Research Sub-Agents in Plan Mode
[[rule]]
toolName = "codebase_investigator"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "architect"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "planner"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "cli_help"
decision = "allow"
priority = 100
modes = ["plan"]

# Discovery Tools in Plan Mode
[[rule]]
toolName = "read_file"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "glob"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "grep_search"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "activate_skill"
decision = "allow"
priority = 100
modes = ["plan"]

# Plan Lifecycle & Communication
[[rule]]
toolName = "save_memory"
decision = "allow"
priority = 100
modes = ["plan"]

# Modification (strictly for planning artifacts)
[[rule]]
toolName = "write_file"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "replace"
decision = "allow"
priority = 100
modes = ["plan"]

# Read-Only Shell Commands in Plan Mode
[[rule]]
toolName = "run_shell_command"
commandPrefix = [
    "git status",
    "git diff",
    "ls",
    "grep",
    "find",
    "cat",
    "pwd",
    "du",
    "df",
    "stat",
    "tree"
]
decision = "allow"
priority = 100
modes = ["plan"]
allow_redirection = true

# Discovery & External Research in Plan Mode
[[rule]]
toolName = "web_fetch"
decision = "allow"
priority = 100
modes = ["plan"]

[[rule]]
toolName = "google_web_search"
decision = "allow"
priority = 100
modes = ["plan"]
